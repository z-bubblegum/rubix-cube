<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2L Trainer - Rubik's Cube Algorithm Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .f2l-welcome {
      justify-content: flex-start;
      padding-top: 3rem;
    }
    .welcome-top {
      text-align: center;
      margin-bottom: 2rem;
    }
    .welcome-top h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-1);
      margin: 0 0 0.4rem;
    }
    .welcome-top p {
      color: var(--text-3);
      font-size: 0.9rem;
    }
    .f2l-cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      max-width: 680px;
      width: 100%;
      margin: 0 auto 2rem;
    }
    .f2l-cat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1rem;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .f2l-cat-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--accent-dim), transparent 70%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .f2l-cat-card:hover::before {
      opacity: 1;
    }
    .f2l-cat-card:hover {
      border-color: var(--border-active);
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    }
    .f2l-cat-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .f2l-cat-card h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-1);
      margin: 0;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }
    .f2l-cat-count {
      font-size: 0.7rem;
      color: var(--text-3);
      font-weight: 500;
      position: relative;
      z-index: 1;
    }
    /* Pair diagram: abstract representation of corner + edge */
    .pair-diagram {
      display: grid;
      gap: 2px;
      grid-template-columns: repeat(2, 14px);
      grid-template-rows: repeat(2, 14px);
    }
    .pair-diagram .pd {
      border-radius: 3px;
    }
    .pair-diagram .corner { background: var(--white); }
    .pair-diagram .edge { background: var(--green); }
    .pair-diagram .slot { background: var(--bg-4); border: 1px dashed rgba(255,255,255,0.15); }
    .pair-diagram .empty { background: transparent; }
    .pair-diagram .ghost { background: rgba(255,255,255,0.1); border: 1px dashed rgba(255,255,255,0.2); }
    /* Specific category icons */
    .f2l-cat-icon.basic { background: rgba(105, 219, 124, 0.12); }
    .f2l-cat-icon.corner-slot { background: rgba(255, 169, 77, 0.12); }
    .f2l-cat-icon.pieces-slot { background: rgba(255, 107, 107, 0.12); }
    .f2l-cat-icon.edge-slot { background: rgba(88, 166, 255, 0.12); }
    .f2l-cat-icon.connected { background: rgba(255, 212, 59, 0.12); }
    .f2l-cat-icon.disconnected { background: rgba(190, 130, 255, 0.12); }
    /* Colors per category */
    .f2l-cat-icon.basic .corner { background: var(--green); }
    .f2l-cat-icon.basic .edge { background: var(--green); opacity: 0.4; }
    .f2l-cat-icon.corner-slot .corner { background: var(--orange); }
    .f2l-cat-icon.corner-slot .edge { background: var(--orange); opacity: 0.5; }
    .f2l-cat-icon.pieces-slot .corner { background: var(--red); }
    .f2l-cat-icon.pieces-slot .edge { background: var(--red); opacity: 0.6; }
    .f2l-cat-icon.edge-slot .corner { background: var(--accent); opacity: 0.5; }
    .f2l-cat-icon.edge-slot .edge { background: var(--accent); }
    .f2l-cat-icon.connected .corner { background: var(--yellow); }
    .f2l-cat-icon.connected .edge { background: var(--yellow); opacity: 0.7; }
    .f2l-cat-icon.disconnected .corner { background: #be82ff; }
    .f2l-cat-icon.disconnected .edge { background: #be82ff; opacity: 0.6; }
    @media (max-width: 640px) {
      .f2l-cat-grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 360px;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Sidebar Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        All Trainers
      </a>
      <div class="logo">
        <div class="logo-cube">
          <div class="logo-face logo-face-r"></div>
          <div class="logo-face logo-face-g"></div>
          <div class="logo-face logo-face-b"></div>
        </div>
        <div>
          <h1>F2L <span>Trainer</span></h1>
          <p>41 First Two Layers Cases</p>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Mobile header -->
    <header class="mobile-header" id="mobile-header">
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <span class="mobile-title" id="mobile-title">F2L Trainer</span>
    </header>

    <div class="content" id="content">
      <!-- Welcome -->
      <div class="welcome f2l-welcome" id="welcome">
        <div class="welcome-top">
          <h2>F2L Algorithm Trainer</h2>
          <p>41 cases organized by pair type. Pick a category to get started.</p>
        </div>
        <div class="f2l-cat-grid" id="f2l-cat-grid"></div>
        <div class="welcome-hint">
          <kbd>Space</kbd> Play/Pause &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> Step &nbsp; <kbd>R</kbd> Reset
        </div>
      </div>

      <!-- Case View -->
      <div class="case-view" id="case-view" style="display:none;">
        <!-- Header -->
        <div class="case-header">
          <span class="case-cat" id="case-cat"></span>
          <h2 class="case-name" id="case-name"></h2>
        </div>

        <!-- Algorithm bar -->
        <div class="alg-bar">
          <span class="alg-label">Algorithm</span>
          <code class="alg-text" id="alg-text"></code>
        </div>

        <!-- Two-column layout: cube + info -->
        <div class="case-body">
          <!-- Left: Cube + Controls -->
          <div class="cube-col">
            <div class="cube-wrapper">
              <div class="cube-container" id="cube-container"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
              <button class="ctrl" id="btn-reset" title="Reset (R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 1 3.4 7.1"/><path d="M3 7v5h5"/></svg>
              </button>
              <button class="ctrl" id="btn-prev" title="Step Back (&larr;)">
                <svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8z" fill="currentColor"/><rect x="5" y="4" width="2.5" height="16" rx="1" fill="currentColor"/></svg>
              </button>
              <button class="ctrl ctrl-play" id="btn-play" title="Play/Pause (Space)">
                <svg viewBox="0 0 24 24" id="play-svg"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
              </button>
              <button class="ctrl" id="btn-next" title="Step Forward (&rarr;)">
                <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z" fill="currentColor"/><rect x="16.5" y="4" width="2.5" height="16" rx="1" fill="currentColor"/></svg>
              </button>
              <button class="ctrl" id="btn-end" title="Jump to End">
                <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z" fill="currentColor"/><rect x="17" y="4" width="3" height="16" rx="1" fill="currentColor"/></svg>
              </button>
              <div class="speed-wrap">
                <select id="speed-sel">
                  <option value="0.5">0.5x</option>
                  <option value="1" selected>1x</option>
                  <option value="1.5">1.5x</option>
                  <option value="2">2x</option>
                  <option value="3">3x</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Right: Info -->
          <div class="info-col">
            <div class="info-card">
              <div class="info-title">Recognition</div>
              <div class="info-text" id="info-recognition"></div>
            </div>
          </div>
        </div>

        <!-- Finger Tricks -->
        <div class="tricks-section">
          <div class="tricks-header">
            <span class="tricks-label">Finger Tricks</span>
            <span class="tricks-hint">Synced with animation</span>
          </div>
          <div class="tricks-grid" id="tricks-grid"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="f2l-data.js"></script>
<script type="module" src="f2l-app.js"></script>
</body>
</html>
